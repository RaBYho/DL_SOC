# Spécifications des modèles du pipeline NIDS
# Validé après inspection statique du Jalon 1

stage1_catboost:
  name: "NIDS-CatBoost"
  source: "https://huggingface.co/pop123ux/pcap-ml-traffic-classifier"
  local_path: "models/cicids_catboost.cbm"
  type: "binary"
  file_size_kb: 604
  scaler_path: null
  features: []

stage1_xgboost:
  name: "NIDS-XGBoost (AegisAI)"
  source: "https://github.com/csperera/aegis-ai"
  local_path: "models/xgb_model.json"
  feature_names_path: "models/xgb_feature_names.json"
  scaler_path: "models/xgb_scaler.pkl"
  type: "binary"
  target_auc: 0.9992
  features: []

stage2_cnn:
  name: "CNN-1D"
  source: "https://huggingface.co/saidimn/ids-cnn-cicids2017"
  local_path: "models/cnn1d_attacks_only.pth"
  scaler_path: "models/scaler.pkl"
  file_size_mb: 1.97
  type: "multiclass"
  num_classes: 14
  classes:
    - "Bot"
    - "DDoS"
    - "DoS GoldenEye"
    - "DoS Hulk"
    - "DoS Slowhttptest"
    - "DoS slowloris"
    - "FTP-Patator"
    - "Heartbleed"
    - "Infiltration"
    - "PortScan"
    - "SSH-Patator"
    - "Web Attack – Brute Force"
    - "Web Attack – Sql Injection"
    - "Web Attack – XSS"

kitsune:
  name: "Kitsune-KitNET"
  source: "https://github.com/ymirsky/Kitsune-py"
  max_autoencoders: 10
  grace_period_fm_prod: 50000
  grace_period_ad_prod: 50000
  grace_period_fm_test: 500
  grace_period_ad_test: 500
