# Configuration du moteur Live et de réduction des fausses alertes (Phase 12)

pre_filter:
  ignore_multicast_broadcast: true
  ignored_ports:
    - 5353  # mDNS
    - 1900  # SSDP
    - 5355  # LLMNR
    - 137   # NetBIOS Name Service
    - 138   # NetBIOS Datagram Service
  min_total_packets: 2
  whitelisted_ips:
    - "127.0.0.1"
  allow_loopback: false
  whitelisted_udp_443_cdns: true
  session_ttl_sec: 120.0

threat_scoring:
  alert_threshold: 100.0
  half_life_sec: 60.0
  weights:
    BENIGN: 0.0
    SUSPECT_UNCERTAIN: 15.0
    ANOMALY_UNKNOWN: 20.0
    KNOWN_ATTACK: 40.0
    KNOWN_ATTACK_HIGH_CONF: 100.0
    UNKNOWN_ATTACK_LIKELY: 60.0

quorum_rules:
  volumetric_classes:
    - "DDoS"
    - "DoS Hulk"
    - "DoS GoldenEye"
    - "DoS Slowloris"
    - "DoS Slowhttptest"
    - "PortScan"
  volumetric_min_flows: 15
  volumetric_window_sec: 10.0
  portscan_min_distinct_ports: 10
  portscan_window_sec: 120.0
  ddos_min_flows: 30
  ddos_window_sec: 5.0

cooldown:
  ttl_sec: 15.0  # Durée en secondes pendant laquelle les alertes pour un même hôte sont dédupliquées (15s par défaut pour tests réactifs)

mtu_normalization:
  enabled: true
  ethernet_mtu: 1514.0
  tcp_mss: 1460.0

kitsune_live:
  enabled: true
  default_t3: 0.0035  # Échelle réelle KitNET normalisé (moyenne bénigne ~0.0019, mu+3sigma ~0.00345)
  dynamic_calibration: true
  calibration_method: "mu_plus_3sigma"  # "mu_plus_3sigma" ou "percentile"
  dynamic_threshold_percentile: 99.9
  dynamic_threshold_multiplier: 1.5
  filter_poisoning_with_stage1: true
  min_clean_flows: 10
  max_history_flows: 2000
